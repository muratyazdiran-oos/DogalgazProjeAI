workflows:
  ios-ci:
    name: DogalgazProjeAI iOS CI
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "DogalgazProjeAI.xcodeproj"
        XCODE_SCHEME: "DogalgazProjeAI"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Verify project and scheme
        script: |
          xcodebuild             -project "$CM_BUILD_DIR/$XCODE_PROJECT"             -scheme "$XCODE_SCHEME"             -showBuildSettings > /tmp/build-settings.txt
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION" /tmp/build-settings.txt
      - name: Build iOS app without code signing
        script: |
          set -o pipefail
          xcodebuild             -project "$CM_BUILD_DIR/$XCODE_PROJECT"             -scheme "$XCODE_SCHEME"             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             clean build             | tee /tmp/xcodebuild.log

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild.log

  ios-app-store:
    name: DogalgazProjeAI App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      groups:
        - code-signing
      vars:
        XCODE_PROJECT: "DogalgazProjeAI.xcodeproj"
        XCODE_SCHEME: "DogalgazProjeAI"
        BUNDLE_ID: "com.murat.dogalgazprojeai"
      integrations:
        app_store_connect: Codemagic

    scripts:
      - name: Verify signing private key
        script: |
          test -n "$CERTIFICATE_PRIVATE_KEY" || (echo "CERTIFICATE_PRIVATE_KEY eksik" && exit 1)
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --create
      - name: Add signing certificate
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: |
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$CM_BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa             --project "$CM_BUILD_DIR/$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
