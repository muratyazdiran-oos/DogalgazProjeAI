name: DogalgazProjeAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - run: node --check backend/server.js
      - name: Import backend dependency graph
        run: node -e "import('./backend/server.js').then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})"
        env:
          GEMINI_API_KEY: ci-placeholder
          APP_API_TOKEN: ci-placeholder
          NODE_ENV: test
      - run: python3 scripts/quality-gates-v23.py
      - run: node --test tests/backend-contract.test.mjs
      - name: Reject committed secrets
        run: |
          ! grep -RInE "(GEMINI_API_KEY|TEAM_AUTH_SECRET|APP_API_TOKEN)=[^[:space:]]+" . --exclude-dir=.git --exclude="*.example"

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app without signing
        run: xcodebuild -project DogalgazProjeAI.xcodeproj -scheme DogalgazProjeAI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
